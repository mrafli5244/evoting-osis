<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin — E-Voting OSIS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0d10;
  color:#f5f5f5;
  font-family:system-ui,sans-serif;
}

main{
  max-width:1000px;
  margin:auto;
  padding:28px 18px;
}

.card{
  background:#12161b;
  border:1px solid #292f37;
  border-radius:16px;
  padding:22px;
  margin:16px 0;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  background:#0c0f13;
  color:#fff;
  border:1px solid #303640;
  border-radius:9px;
}

button{
  padding:13px 16px;
  border:0;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
  margin-top:8px;
}

.primary{
  background:#2563eb;
  color:white;
}

.success{
  background:#16a34a;
  color:white;
}

.danger{
  background:#dc2626;
  color:white;
}

.logout{
  background:#272d36;
  color:white;
}

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
}

.stat{
  font-size:28px;
  font-weight:800;
}

.muted{
  opacity:.65;
}

.msg{
  min-height:22px;
}

.hidden{
  display:none;
}

.candidates{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}

.candidate{
  background:#171b21;
  border:1px solid #303640;
  border-radius:15px;
  padding:18px;
}

.candidate-photo{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:12px;
  background:#0c0f13;
  display:block;
  margin-bottom:15px;
}

.no-photo{
  width:100%;
  height:260px;
  border-radius:12px;
  background:#0c0f13;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  margin-bottom:15px;
}

.candidate-number{
  color:#60a5fa;
  font-weight:bold;
}

.candidate-name{
  font-size:20px;
  font-weight:800;
  margin-top:8px;
  line-height:1.4;
}

.file-input{
  padding:10px;
}

.upload-button{
  width:100%;
  background:#2563eb;
  color:white;
}

.delete-button{
  width:100%;
  background:#dc2626;
  color:white;
}

@media(max-width:600px){
  main{
    padding:18px 12px;
  }

  .card{
    padding:18px;
  }
}
</style>
</head>

<body>

<main>

<h1>🛠️ Dashboard Admin</h1>

<p class="muted">
E-Voting Ketua & Wakil Ketua OSIS
</p>


<!-- LOGIN -->

<section id="login" class="card">

<h2>Login Admin</h2>

<input
  id="username"
  placeholder="Email admin"
  autocomplete="username"
>

<input
  id="password"
  type="password"
  placeholder="Password"
  autocomplete="current-password"
>

<button
  class="primary"
  onclick="login()"
>
Masuk
</button>

<p id="loginMsg" class="msg"></p>

</section>


<!-- DASHBOARD -->

<section id="dashboard" class="hidden">


<!-- ADMIN -->

<div class="card">

<h2>👋 Dashboard Admin</h2>

<p id="adminName" class="muted">
Memuat...
</p>

<button
  class="logout"
  onclick="logout()"
>
Keluar
</button>

</div>


<!-- STATISTIK -->

<div class="grid">

<div class="card">

<div class="muted">
Total Pemilih
</div>

<div id="voters" class="stat">
—
</div>

</div>


<div class="card">

<div class="muted">
Sudah Memilih
</div>

<div id="voted" class="stat">
—
</div>

</div>


<div class="card">

<div class="muted">
Suara Masuk
</div>

<div id="votes" class="stat">
—
</div>

</div>

</div>


<!-- PENGATURAN -->

<section class="card">

<h2>⚙️ Pengaturan Pemilihan</h2>

<label>Nama pemilihan</label>

<input id="election_name">


<label>Mulai</label>

<input
  id="start_at"
  type="datetime-local"
>


<label>Selesai</label>

<input
  id="end_at"
  type="datetime-local"
>


<label>Waktu per siswa (menit)</label>

<input
  id="minutes"
  type="number"
  min="1"
  max="30"
>


<label>Status</label>

<select id="status">
<option value="draft">Draft</option>
<option value="open">Buka</option>
<option value="paused">Jeda</option>
<option value="closed">Tutup</option>
</select>


<label>Hasil</label>

<select id="results_mode">
<option value="hidden">Sembunyikan</option>
<option value="after_closed">Setelah ditutup</option>
<option value="manual">Manual</option>
</select>


<button
  class="success"
  onclick="saveSettings()"
>
Simpan Pengaturan
</button>

<p id="settingsMsg" class="msg"></p>

</section>


<!-- FOTO KANDIDAT -->

<section class="card">

<h2>📸 Foto Kandidat</h2>

<p class="muted">
Upload foto masing-masing pasangan kandidat.
Foto akan otomatis muncul di halaman voting.
</p>

<div
  id="candidateList"
  class="candidates"
>
Memuat kandidat...
</div>

<p id="photoMessage" class="msg"></p>

</section>


</section>

</main>


<script>

// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
"https://uctbslkumtrlwbonvutz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IcsnBvHUXh6q1I4nV4xTNA_vsYYxxbv";

const client =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// =====================================================
// LOGIN
// =====================================================

async function login(){

  const msg =
    document.getElementById("loginMsg");

  msg.textContent =
    "Memeriksa...";


  const email =
    document
      .getElementById("username")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  if(!email || !password){

    msg.textContent =
      "Email dan password wajib diisi.";

    return;
  }


  const {
    data,
    error
  } =
    await client.auth.signInWithPassword({
      email:email,
      password:password
    });


  if(error){

    msg.textContent =
      "Login gagal: " +
      error.message;

    return;
  }


  const {
    data:profile,
    error:profileError
  } =
    await client
      .from("admin_profiles")
      .select("display_name,role")
      .eq("user_id",data.user.id)
      .maybeSingle();


  if(profileError){

    await client.auth.signOut();

    msg.textContent =
      profileError.message;

    return;
  }


  if(!profile){

    await client.auth.signOut();

    msg.textContent =
      "Akun ini bukan admin.";

    return;
  }


  document
    .getElementById("login")
    .classList.add("hidden");


  document
    .getElementById("dashboard")
    .classList.remove("hidden");


  document
    .getElementById("adminName")
    .textContent =
      profile.display_name +
      " • " +
      profile.role;


  await loadAll();
}


// =====================================================
// LOAD SEMUA
// =====================================================

async function loadAll(){

  await loadSettings();

  await loadStats();

  await loadCandidates();

}


// =====================================================
// SETTINGS
// =====================================================

function toLocal(v){

  if(!v)
    return "";

  return new Date(v)
    .toISOString()
    .slice(0,16);
}


async function loadSettings(){

  const {
    data,
    error
  } =
    await client
      .from("settings")
      .select("*")
      .eq("id",1)
      .single();


  if(error){

    document
      .getElementById("settingsMsg")
      .textContent =
        error.message;

    return;
  }


  document
    .getElementById("election_name")
    .value =
      data.election_name || "";


  document
    .getElementById("start_at")
    .value =
      toLocal(data.start_at);


  document
    .getElementById("end_at")
    .value =
      toLocal(data.end_at);


  document
    .getElementById("minutes")
    .value =
      data.minutes_per_voter || 5;


  document
    .getElementById("status")
    .value =
      data.status;


  document
    .getElementById("results_mode")
    .value =
      data.results_mode;

}


// =====================================================
// SAVE SETTINGS
// =====================================================

async function saveSettings(){

  const {
    error
  } =
    await client
      .from("settings")
      .update({

        election_name:
          document
            .getElementById("election_name")
            .value,

        start_at:
          document
            .getElementById("start_at")
            .value
            ?
            new Date(
              document
                .getElementById("start_at")
                .value
            ).toISOString()
            :
            null,

        end_at:
          document
            .getElementById("end_at")
            .value
            ?
            new Date(
              document
                .getElementById("end_at")
                .value
            ).toISOString()
            :
            null,

        minutes_per_voter:
          Number(
            document
              .getElementById("minutes")
              .value
          ),

        status:
          document
            .getElementById("status")
            .value,

        results_mode:
          document
            .getElementById("results_mode")
            .value,

        updated_at:
          new Date().toISOString()

      })
      .eq("id",1);


  document
    .getElementById("settingsMsg")
    .textContent =
      error
      ?
      error.message
      :
      "Pengaturan tersimpan ✓";

}


// =====================================================
// STATISTIK
// =====================================================

async function loadStats(){

  const {
    count:total
  } =
    await client
      .from("voters")
      .select("*",{
        count:"exact",
        head:true
      });


  const {
    count:voted
  } =
    await client
      .from("voters")
      .select("*",{
        count:"exact",
        head:true
      })
      .eq("has_voted",true);


  const {
    count:voteCount
  } =
    await client
      .from("votes")
      .select("*",{
        count:"exact",
        head:true
      });


  document
    .getElementById("voters")
    .textContent =
      total ?? 0;


  document
    .getElementById("voted")
    .textContent =
      voted ?? 0;


  document
    .getElementById("votes")
    .textContent =
      voteCount ?? 0;

}


// =====================================================
// LOAD KANDIDAT
// =====================================================

async function loadCandidates(){

  const box =
    document
      .getElementById("candidateList");


  box.textContent =
    "Memuat kandidat...";


  const {
    data:candidates,
    error
  } =
    await client
      .from("candidates")
      .select(
        "id,number,chairman_name,vice_name,vision,mission,photo_url"
      )
      .eq("active",true)
      .order("number");


  if(error){

    box.textContent =
      "Gagal membaca kandidat: " +
      error.message;

    return;
  }


  if(!candidates || candidates.length === 0){

    box.textContent =
      "Belum ada kandidat.";

    return;
  }


  box.innerHTML = "";


  candidates.forEach(candidate => {

    const div =
      document.createElement("div");

    div.className =
      "candidate";


    const photoHTML =
      candidate.photo_url
      ?
      `
      <img
        class="candidate-photo"
        src="${esc(candidate.photo_url)}"
        alt="Foto kandidat"
      >
      `
      :
      `
      <div class="no-photo">
        📷 Belum ada foto
      </div>
      `;


    div.innerHTML = `

      ${photoHTML}

      <div class="candidate-number">
        NOMOR ${esc(candidate.number)}
      </div>

      <div class="candidate-name">
        ${esc(candidate.chairman_name)}
        <br>
        &
        <br>
        ${esc(candidate.vice_name)}
      </div>

      <p class="muted">
        <b>Visi:</b><br>
        ${esc(candidate.vision || "-")}
      </p>

      <p class="muted">
        <b>Misi:</b><br>
        ${esc(candidate.mission || "-")}
      </p>

      <label>
        Pilih foto
      </label>

      <input
        class="file-input"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        id="file-${candidate.id}"
      >

      <button
        class="upload-button"
        onclick="uploadPhoto('${candidate.id}')"
      >
        📤 Upload Foto
      </button>

      ${
        candidate.photo_url
        ?
        `
        <button
          class="delete-button"
          onclick="deletePhoto('${candidate.id}')"
        >
          🗑️ Hapus Foto
        </button>
        `
        :
        ""
      }

    `;


    box.appendChild(div);

  });

}


// =====================================================
// UPLOAD FOTO
// =====================================================

async function uploadPhoto(candidateId){

  const input =
    document.getElementById(
      "file-" + candidateId
    );


  const message =
    document.getElementById(
      "photoMessage"
    );


  if(!input || !input.files.length){

    message.textContent =
      "❌ Pilih foto terlebih dahulu.";

    return;
  }


  const file =
    input.files[0];


  // MAKSIMAL 5 MB

  if(file.size > 5 * 1024 * 1024){

    message.textContent =
      "❌ Ukuran foto maksimal 5 MB.";

    return;
  }


  // FORMAT FOTO

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp"
  ];


  if(!allowedTypes.includes(file.type)){

    message.textContent =
      "❌ Format harus JPG, PNG, atau WEBP.";

    return;
  }


  message.textContent =
    "⏳ Mengupload foto...";


  try{

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      candidateId +
      "-" +
      Date.now() +
      "." +
      extension;


    // UPLOAD KE STORAGE

    const {
      error:uploadError
    } =
      await client
        .storage
        .from("candidate-photos")
        .upload(
          fileName,
          file,
          {
            cacheControl:"3600",
            upsert:false
          }
        );


    if(uploadError)
      throw uploadError;


    // URL PUBLIC

    const {
      data:urlData
    } =
      client
        .storage
        .from("candidate-photos")
        .getPublicUrl(
          fileName
        );


    const photoUrl =
      urlData.publicUrl;


    // SIMPAN URL KE DATABASE

    const {
      error:updateError
    } =
      await client
        .from("candidates")
        .update({
          photo_url:photoUrl
        })
        .eq(
          "id",
          candidateId
        );


    if(updateError)
      throw updateError;


    message.textContent =
      "✅ Foto berhasil diupload.";


    await loadCandidates();

  }
  catch(error){

    console.error(error);

    message.textContent =
      "❌ Upload gagal: " +
      error.message;

  }

}


// =====================================================
// HAPUS FOTO
// =====================================================

async function deletePhoto(candidateId){

  const yakin =
    confirm(
      "Yakin ingin menghapus foto kandidat ini?"
    );


  if(!yakin)
    return;


  const message =
    document.getElementById(
      "photoMessage"
    );


  try{

    const {
      data:candidate,
      error:getError
    } =
      await client
        .from("candidates")
        .select("photo_url")
        .eq("id",candidateId)
        .single();


    if(getError)
      throw getError;


    // HAPUS URL DARI DATABASE

    const {
      error:updateError
    } =
      await client
        .from("candidates")
        .update({
          photo_url:null
        })
        .eq(
          "id",
          candidateId
        );


    if(updateError)
      throw updateError;


    // HAPUS FILE STORAGE

    if(candidate.photo_url){

      const parts =
        candidate.photo_url
          .split("/candidate-photos/");


      if(parts.length > 1){

        const filePath =
          decodeURIComponent(parts[1]);


        await client
          .storage
          .from("candidate-photos")
          .remove([
            filePath
          ]);

      }

    }


    message.textContent =
      "✅ Foto berhasil dihapus.";


    await loadCandidates();

  }
  catch(error){

    console.error(error);

    message.textContent =
      "❌ Gagal menghapus foto: " +
      error.message;

  }

}


// =====================================================
// LOGOUT
// =====================================================

async function logout(){

  await client.auth.signOut();


  document
    .getElementById("login")
    .classList.remove("hidden");


  document
    .getElementById("dashboard")
    .classList.add("hidden");

}


// =====================================================
// ESCAPE HTML
// =====================================================

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[m];

      }
    );

}


// =====================================================
// CEK SESSION ADMIN
// =====================================================

async function checkAdmin(){

  const {
    data:{
      user
    }
  } =
    await client.auth.getUser();


  if(!user)
    return;


  const {
    data:profile
  } =
    await client
      .from("admin_profiles")
      .select(
        "display_name,role"
      )
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(!profile){

    await client.auth.signOut();

    return;
  }


  document
    .getElementById("login")
    .classList.add("hidden");


  document
    .getElementById("dashboard")
    .classList.remove("hidden");


  document
    .getElementById("adminName")
    .textContent =
      profile.display_name +
      " • " +
      profile.role;


  await loadAll();

}


checkAdmin();

</script>

</body>
</html>

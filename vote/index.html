<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>E-Voting OSIS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0d10;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 16px;
    }

    .card {
      background: #12161b;
      border: 1px solid #2c333c;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .subtitle {
      color: #9ca3af;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #343b45;
      background: #0b0d10;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .candidate {
      border: 1px solid #343b45;
      border-radius: 14px;
      padding: 18px;
      margin: 12px 0;
      cursor: pointer;
    }

    .candidate:hover {
      border-color: white;
    }

    .candidate.selected {
      border: 2px solid white;
      background: #1b2027;
    }

    .number {
      font-size: 14px;
      color: #9ca3af;
    }

    .timer {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      margin-top: 10px;
    }

    .message {
      margin-top: 12px;
      color: #cbd5e1;
      min-height: 20px;
    }

    .hidden {
      display: none;
    }

    .success {
      text-align: center;
      padding: 30px 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🗳️ E-Voting OSIS</h1>
  <p id="electionName" class="subtitle">
    Memuat pemilihan...
  </p>

  <!-- LOGIN -->
  <section id="loginSection" class="card">

    <h2>Login Pemilih</h2>

    <p class="subtitle">
      Gunakan akun pemilih yang diberikan panitia.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Email pemilih"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Masuk
    </button>

    <div id="loginMessage" class="message"></div>

  </section>


  <!-- HALAMAN VOTING -->
  <section id="voteSection" class="hidden">

    <div class="card">

      <p class="subtitle">
        Sisa waktu
      </p>

      <div id="timer" class="timer">
        --:--
      </div>

    </div>


    <div class="card">

      <h2>Pilih Pasangan Calon</h2>

      <p class="subtitle">
        Pilih satu pasangan calon.
      </p>

      <div id="candidateList">
        Memuat kandidat...
      </div>

      <button onclick="confirmVote()">
        Konfirmasi Pilihan
      </button>

      <div id="voteMessage" class="message"></div>

    </div>

  </section>


  <!-- SELESAI -->
  <section id="successSection" class="card hidden">

    <div class="success">

      <h2>✅ Suara Berhasil Dicatat</h2>

      <p>
        Terima kasih. Suara Anda telah berhasil disimpan.
      </p>

    </div>

  </section>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://uctbslkumtrlwbonvutz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IcsnBvHUXh6q1I4nV4xTNA_vsYYxxbv";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let selectedCandidate = null;
let deadline = null;
let timerInterval = null;


// ================================
// LOAD INFORMASI PEMILIHAN
// ================================

async function loadElection() {

  const { data, error } =
    await supabaseClient
      .from("settings")
      .select(
        "election_name,status,minutes_per_voter"
      )
      .eq("id", 1)
      .single();

  if (error) {

    document.getElementById("electionName").textContent =
      "Gagal memuat pemilihan.";

    return;
  }

  document.getElementById("electionName").textContent =
    data.election_name +
    " • Status: " +
    data.status;

}


// ================================
// LOGIN
// ================================

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if (!email || !password) {

    message.textContent =
      "Email dan password wajib diisi.";

    return;
  }

  message.textContent =
    "Memeriksa akun...";


  const { error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    message.textContent =
      "Login gagal: " + error.message;

    return;
  }


  // Ambil user yang sedang login

  const { data: userData } =
    await supabaseClient.auth.getUser();

  const user =
    userData.user;


  // Pastikan akun tersebut terdaftar
  // sebagai pemilih

  const { data: voter, error: voterError } =
    await supabaseClient
      .from("voters")
      .select("id,has_voted")
      .eq("auth_user_id", user.id)
      .single();


  if (voterError || !voter) {

    await supabaseClient.auth.signOut();

    message.textContent =
      "Akun ini belum terdaftar sebagai pemilih.";

    return;
  }


  // Jika sudah memilih

  if (voter.has_voted) {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("successSection")
      .classList.remove("hidden");

    document.querySelector(
      "#successSection h2"
    ).textContent =
      "⚠️ Anda Sudah Memilih";

    document.querySelector(
      "#successSection p"
    ).textContent =
      "Akun ini sudah digunakan untuk memberikan suara.";

    return;
  }


  // Masuk halaman voting

  document
    .getElementById("loginSection")
    .classList.add("hidden");

  document
    .getElementById("voteSection")
    .classList.remove("hidden");


  await loadCandidates();

  await startTimer();

}


// ================================
// LOAD KANDIDAT
// ================================

async function loadCandidates() {

  const container =
    document.getElementById("candidateList");


  const { data, error } =
    await supabaseClient
      .from("candidates")
      .select(
        "id,number,chairman_name,vice_name,vision,mission"
      )
      .eq("active", true)
      .order("number");


  if (error) {

    container.textContent =
      "Gagal memuat kandidat.";

    return;
  }


  if (!data || data.length === 0) {

    container.textContent =
      "Belum ada kandidat yang tersedia.";

    return;
  }


  container.innerHTML = "";


  data.forEach(candidate => {

    const div =
      document.createElement("div");

    div.className =
      "candidate";

    div.onclick = () =>
      selectCandidate(
        candidate.id,
        div
      );


    div.innerHTML = `

      <div class="number">
        NOMOR URUT ${escapeHTML(candidate.number)}
      </div>

      <h3>
        ${escapeHTML(candidate.chairman_name)}
        &
        ${escapeHTML(candidate.vice_name)}
      </h3>

      <p>
        ${escapeHTML(candidate.vision || "")}
      </p>

    `;


    container.appendChild(div);

  });

}


// ================================
// PILIH KANDIDAT
// ================================

function selectCandidate(
  id,
  element
) {

  selectedCandidate = id;


  document
    .querySelectorAll(".candidate")
    .forEach(item => {

      item.classList.remove(
        "selected"
      );

    });


  element.classList.add(
    "selected"
  );

}


// ================================
// TIMER
// ================================

async function startTimer() {

  const { data, error } =
    await supabaseClient
      .from("settings")
      .select("minutes_per_voter")
      .eq("id", 1)
      .single();


  if (error) {

    return;
  }


  const minutes =
    Number(data.minutes_per_voter) || 2;


  deadline =
    Date.now() +
    minutes * 60 * 1000;


  updateTimer();


  timerInterval =
    setInterval(
      updateTimer,
      500
    );

}


// ================================

function updateTimer() {

  const remaining =
    Math.max(
      0,
      deadline - Date.now()
    );


  const seconds =
    Math.ceil(
      remaining / 1000
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  document.getElementById(
    "timer"
  ).textContent =

    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0");


  if (seconds <= 0) {

    clearInterval(
      timerInterval
    );


    document.getElementById(
      "voteMessage"
    ).textContent =
      "Waktu voting telah habis.";


    document.querySelector(
      "#voteSection button"
    ).disabled = true;

  }

}


// ================================
// KONFIRMASI VOTE
// ================================

async function confirmVote() {

  const message =
    document.getElementById(
      "voteMessage"
    );


  if (!selectedCandidate) {

    message.textContent =
      "Pilih pasangan calon terlebih dahulu.";

    return;
  }


  if (
    !deadline ||
    Date.now() > deadline
  ) {

    message.textContent =
      "Waktu voting telah habis.";

    return;
  }


  const yakin =
    confirm(
      "Yakin dengan pilihan ini?\n\n" +
      "Suara yang sudah dikirim tidak dapat diubah."
    );


  if (!yakin) {

    return;
  }


  message.textContent =
    "Menyimpan suara...";


  const { error } =
    await supabaseClient.rpc(
      "cast_vote",
      {
        p_candidate_id:
          selectedCandidate
      }
    );


  if (error) {

    message.textContent =
      "Suara gagal disimpan: " +
      error.message;

    return;
  }


  clearInterval(
    timerInterval
  );


  document
    .getElementById("voteSection")
    .classList.add("hidden");


  document
    .getElementById("successSection")
    .classList.remove("hidden");


  await supabaseClient.auth.signOut();

}


// ================================
// KEAMANAN TAMPILAN
// ================================

function escapeHTML(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(character) {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[character];

      }
    );

}


// Jalankan saat halaman dibuka

loadElection();

</script>

</body>
</html>

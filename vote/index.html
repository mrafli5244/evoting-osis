<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>E-Voting OSIS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080b10;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 460px;
      background: #11161d;
      border: 1px solid #29313c;
      border-radius: 22px;
      padding: 28px;
    }

    .logo {
      text-align: center;
      font-size: 50px;
    }

    h1 {
      text-align: center;
      margin: 10px 0;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #394351;
      background: #080b10;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    .error {
      color: #fca5a5;
    }

    .success {
      color: #86efac;
    }

    .status {
      text-align: center;
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #171d25;
      color: #9ca3af;
    }

    .hidden {
      display: none;
    }

    .welcome {
      text-align: center;
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #0b1220;
    }

    .continue {
      background: #16a34a;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">🗳️</div>

  <h1>E-Voting OSIS</h1>

  <div class="subtitle">
    Silakan masuk untuk mengikuti pemilihan
  </div>


  <!-- HALAMAN LOGIN PEMILIH -->

  <div id="loginPage">

    <label>Nama Lengkap</label>

    <input
      id="nama"
      type="text"
      placeholder="Contoh: Aldi"
    >


    <label>Kelas</label>

    <input
      id="kelas"
      type="text"
      placeholder="Contoh: XII IPA 1"
    >


    <button
      id="loginButton"
      onclick="loginPemilih()"
    >
      MASUK
    </button>


    <div
      id="message"
      class="message"
    ></div>


    <div
      id="status"
      class="status"
    >
      Memeriksa status pemilihan...
    </div>

  </div>


  <!-- SETELAH LOGIN -->

  <div
    id="welcomePage"
    class="hidden"
  >

    <div class="welcome">

      <div class="success">
        ✅ Identitas ditemukan
      </div>

      <br>

      <strong id="welcomeName"></strong>

      <p class="subtitle">
        Identitas pemilih berhasil diverifikasi.
      </p>

    </div>


    <button
      class="continue"
      onclick="lanjutVoting()"
    >
      LANJUT KE PEMILIHAN →
    </button>

  </div>

</div>


<script>

// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
  "https://uctbslkumtrlwbonvutz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IcsnBvHUXh6q1I4nV4xTNA_vsYYxxbv";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// =====================================================
// CEK STATUS PEMILIHAN
// =====================================================

async function checkElectionStatus() {

  const statusBox =
    document.getElementById("status");

  const {
    data,
    error
  } =
    await supabaseClient
      .from("settings")
      .select("status,start_at,end_at")
      .eq("id", 1)
      .single();


  if (error) {

    statusBox.textContent =
      "Gagal membaca status pemilihan.";

    return;
  }


  const now = new Date();

  const start =
    data.start_at
      ? new Date(data.start_at)
      : null;

  const end =
    data.end_at
      ? new Date(data.end_at)
      : null;


  const isOpen =
    data.status === "open" &&
    (!start || now >= start) &&
    (!end || now <= end);


  if (isOpen) {

    statusBox.textContent =
      "🟢 Pemilihan sedang dibuka";

    statusBox.style.color =
      "#86efac";

  } else {

    statusBox.textContent =
      "🔴 Pemilihan sedang ditutup";

    statusBox.style.color =
      "#fca5a5";

  }

}


// =====================================================
// LOGIN PEMILIH
// =====================================================

async function loginPemilih() {

  const nama =
    document
      .getElementById("nama")
      .value
      .trim();


  const kelas =
    document
      .getElementById("kelas")
      .value
      .trim();


  const message =
    document
      .getElementById("message");


  const button =
    document
      .getElementById("loginButton");


  message.textContent = "";


  if (!nama || !kelas) {

    message.textContent =
      "Nama dan kelas wajib diisi.";

    message.className =
      "message error";

    return;
  }


  button.disabled = true;

  button.textContent =
    "MEMERIKSA...";


  try {

    // Cek status

    const {
      data: settings,
      error: settingsError
    } =
      await supabaseClient
        .from("settings")
        .select("status,start_at,end_at")
        .eq("id", 1)
        .single();


    if (settingsError) {
      throw settingsError;
    }


    const now = new Date();

    const start =
      settings.start_at
        ? new Date(settings.start_at)
        : null;

    const end =
      settings.end_at
        ? new Date(settings.end_at)
        : null;


    const isOpen =
      settings.status === "open" &&
      (!start || now >= start) &&
      (!end || now <= end);


    if (!isOpen) {

      message.textContent =
        "🔴 Pemilihan sedang ditutup.";

      message.className =
        "message error";

      return;
    }


    // Cari pemilih

    const {
      data: voter,
      error: voterError
    } =
      await supabaseClient
        .from("voters")
        .select(
          "id,name,kelas,tipe_pemilih,has_voted"
        )
        .ilike("name", nama)
        .ilike("kelas", kelas)
        .maybeSingle();


    if (voterError) {
      throw voterError;
    }


    if (!voter) {

      message.textContent =
        "❌ Nama dan kelas tidak ditemukan.";

      message.className =
        "message error";

      return;
    }


    if (voter.has_voted) {

      message.textContent =
        "⚠️ Pemilih ini sudah memilih.";

      message.className =
        "message error";

      return;
    }


    // Berhasil

    document
      .getElementById("loginPage")
      .classList.add("hidden");


    document
      .getElementById("welcomePage")
      .classList.remove("hidden");


    document
      .getElementById("welcomeName")
      .textContent =
        voter.name +
        " • " +
        voter.kelas;

  }

  catch (error) {

    message.textContent =
      "Terjadi kesalahan: " +
      error.message;

    message.className =
      "message error";

  }

  finally {

    button.disabled = false;

    button.textContent =
      "MASUK";

  }

}


// =====================================================
// LANJUT KE HALAMAN KANDIDAT
// =====================================================

function lanjutVoting() {

  alert(
    "Login berhasil. Halaman kandidat akan kita buat berikutnya."
  );

}


// Jalankan pengecekan

checkElectionStatus();

</script>

</body>
</html>

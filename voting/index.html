<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pilih Kandidat — E-Voting OSIS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080b10;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px 15px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .voter {
      background: #11161d;
      border: 1px solid #29313c;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 25px;
      text-align: center;
    }

    .voter strong {
      color: #60a5fa;
    }

    .candidates {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(290px, 1fr));
      gap: 20px;
    }

    .candidate {
      background: #11161d;
      border: 1px solid #29313c;
      border-radius: 18px;
      overflow: hidden;
      transition: .2s;
    }

    .candidate:hover {
      transform: translateY(-3px);
      border-color: #3b82f6;
    }

    .photo {
      width: 100%;
      height: 300px;
      background: #171d25;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .candidate-info {
      padding: 22px;
    }

    .number {
      color: #60a5fa;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 10px;
      text-align: center;
    }

    .names {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.4;
      text-align: center;
    }

    .section {
      margin-top: 18px;
      text-align: left;
    }

    .section-title {
      font-weight: bold;
      color: #60a5fa;
      margin-bottom: 7px;
    }

    .vision,
    .mission {
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 14px;
    }

    .mission {
      white-space: pre-line;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      padding: 20px;
      color: #9ca3af;
    }

    .error {
      color: #fca5a5;
    }

    .success {
      color: #86efac;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #9ca3af;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #9ca3af;
    }

    .warning {
      background: #17120c;
      border: 1px solid #4b3620;
      color: #fbbf24;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }

    @media(max-width:600px) {

      body {
        padding: 18px 12px;
      }

      .candidate-info {
        padding: 18px;
      }

      .photo {
        height: 280px;
      }

      .names {
        font-size: 20px;
      }

    }

  </style>
</head>

<body>

<div class="container">

  <h1>🗳️ Pilih Kandidat</h1>

  <div class="subtitle">
    Pemilihan Ketua & Wakil Ketua OSIS
  </div>


  <!-- =========================================
       DATA PEMILIH
  ========================================== -->

  <div class="voter">

    Pemilih:

    <strong id="voterName">
      -
    </strong>

  </div>


  <!-- =========================================
       PESAN
  ========================================== -->

  <div
    id="message"
    class="message"
  >
    Memuat kandidat...
  </div>


  <!-- =========================================
       DAFTAR KANDIDAT
  ========================================== -->

  <div
    id="candidates"
    class="candidates"
  ></div>

</div>


<script>

// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
  "https://uctbslkumtrlwbonvutz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IcsnBvHUXh6q1I4nV4xTNA_vsYYxxbv";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// =====================================================
// SESSION PEMILIH
// =====================================================

const voterId =
  sessionStorage.getItem("voter_id");

const voterName =
  sessionStorage.getItem("voter_name");

const voterKelas =
  sessionStorage.getItem("voter_kelas");


// =====================================================
// CEK SESSION
// =====================================================

if (!voterId) {

  document
    .getElementById("message")
    .innerHTML =
      "❌ Sesi pemilih tidak ditemukan.<br><br>" +
      "Silakan kembali ke halaman utama dan login lagi.";

  document
    .getElementById("message")
    .classList.add("error");

} else {

  document
    .getElementById("voterName")
    .textContent =
      voterName
        ? voterName +
          (
            voterKelas
              ? " • " + voterKelas
              : ""
          )
        : "-";

  loadCandidates();

}


// =====================================================
// LOAD KANDIDAT
// =====================================================

async function loadCandidates() {

  const message =
    document.getElementById("message");

  const box =
    document.getElementById("candidates");


  message.textContent =
    "Memuat kandidat...";


  try {

    // ================================================
    // CEK STATUS PEMILIHAN
    // ================================================

    const {
      data: settings,
      error: settingsError
    } =
      await supabaseClient
        .from("settings")
        .select(
          "status,start_at,end_at"
        )
        .eq("id", 1)
        .single();


    if (settingsError) {

      throw settingsError;

    }


    const now =
      new Date();


    const start =
      settings.start_at
        ? new Date(settings.start_at)
        : null;


    const end =
      settings.end_at
        ? new Date(settings.end_at)
        : null;


    const isOpen =
      settings.status === "open" &&
      (!start || now >= start) &&
      (!end || now <= end);


    if (!isOpen) {

      message.innerHTML =
        "🔴 Pemilihan sedang ditutup.";

      message.classList.add(
        "error"
      );

      return;

    }


    // ================================================
    // AMBIL KANDIDAT
    // ================================================

    const {
      data,
      error
    } =
      await supabaseClient
        .from("candidates")
        .select(
          "id,number,chairman_name,vice_name,vision,mission,photo_url"
        )
        .eq("active", true)
        .order("number");


    if (error) {

      throw error;

    }


    if (!data || data.length === 0) {

      message.textContent =
        "Belum ada kandidat yang tersedia.";

      message.classList.add(
        "empty"
      );

      return;

    }


    message.textContent = "";

    message.className =
      "message";


    box.innerHTML = "";


    // ================================================
    // TAMPILKAN KANDIDAT
    // ================================================

    data.forEach(candidate => {

      const card =
        document.createElement("div");


      card.className =
        "candidate";


      // ============================================
      // FOTO
      // ============================================

      let photoHTML = `
        <div class="photo">
          📷 Foto kandidat belum tersedia
        </div>
      `;


      if (candidate.photo_url) {

        photoHTML = `
          <div class="photo">

            <img
              src="${escapeHtml(candidate.photo_url)}"
              alt="Foto kandidat"
              loading="lazy"
            >

          </div>
        `;

      }


      // ============================================
      // VISI
      // ============================================

      const visionHTML =
        candidate.vision
        ?
        `
          <div class="section">

            <div class="section-title">
              🎯 VISI
            </div>

            <div class="vision">
              ${escapeHtml(candidate.vision)}
            </div>

          </div>
        `
        :
        "";


      // ============================================
      // MISI
      // ============================================

      const missionHTML =
        candidate.mission
        ?
        `
          <div class="section">

            <div class="section-title">
              📌 MISI
            </div>

            <div class="mission">
              ${escapeHtml(candidate.mission)}
            </div>

          </div>
        `
        :
        "";


      // ============================================
      // CARD
      // ============================================

      card.innerHTML = `

        ${photoHTML}

        <div class="candidate-info">

          <div class="number">
            NOMOR ${escapeHtml(candidate.number)}
          </div>

          <div class="names">

            ${escapeHtml(candidate.chairman_name)}

            <br>

            &

            <br>

            ${escapeHtml(candidate.vice_name)}

          </div>

          ${visionHTML}

          ${missionHTML}

          <button
            class="vote-button"
            data-candidate-id="${escapeHtml(candidate.id)}"
          >
            🗳️ PILIH KANDIDAT
          </button>

        </div>

      `;


      const voteButton =
        card.querySelector(
          ".vote-button"
        );


      voteButton.addEventListener(
        "click",
        function() {

          pilihKandidat(
            candidate.id,
            candidate.chairman_name,
            candidate.vice_name,
            candidate.number
          );

        }
      );


      box.appendChild(card);

    });

  }

  catch (error) {

    console.error(
      "LOAD CANDIDATES ERROR:",
      error
    );


    message.textContent =
      "❌ Gagal memuat kandidat: " +
      error.message;

    message.classList.add(
      "error"
    );

  }

}


// =====================================================
// PILIH KANDIDAT
// =====================================================

async function pilihKandidat(
  candidateId,
  chairmanName,
  viceName,
  candidateNumber
) {

  const buttons =
    document.querySelectorAll(
      ".vote-button"
    );


  // ================================================
  // CEGAH DOUBLE CLICK
  // ================================================

  buttons.forEach(button => {

    button.disabled =
      true;

  });


  try {

    // ================================================
    // CEK ID PEMILIH
    // ================================================

    const currentVoterId =
      sessionStorage.getItem(
        "voter_id"
      );


    const currentName =
      sessionStorage.getItem(
        "voter_name"
      );


    const currentKelas =
      sessionStorage.getItem(
        "voter_kelas"
      );


    if (!currentVoterId) {

      alert(
        "Sesi pemilih tidak ditemukan.\n\n" +
        "Silakan login kembali."
      );

      window.location.href =
        "../";

      return;

    }


    // ================================================
    // KONFIRMASI
    // ================================================

    const yakin =
      confirm(
        "Konfirmasi pilihan\n\n" +

        "Nomor " +
        candidateNumber +
        "\n" +

        chairmanName +
        " & " +
        viceName +
        "\n\n" +

        "Nama pemilih:\n" +
        currentName +

        (
          currentKelas
            ? "\n" + currentKelas
            : ""
        ) +

        "\n\n" +

        "Yakin ingin memilih pasangan ini?\n\n" +

        "Pilihan yang sudah dikirim " +
        "tidak dapat diubah."
      );


    if (!yakin) {

      buttons.forEach(button => {

        button.disabled =
          false;

      });

      return;

    }


    // ================================================
    // VERIFIKASI PEMILIH VIA RPC
    // ================================================

    const {
      data: voterData,
      error: voterError
    } =
      await supabaseClient.rpc(
        "verify_voter",
        {
          p_name:
            currentName,

          p_kelas:
            currentKelas
        }
      );


    if (voterError) {

      throw voterError;

    }


    const voter =
      voterData &&
      voterData.length > 0
        ? voterData[0]
        : null;


    if (!voter) {

      throw new Error(
        "Data pemilih tidak ditemukan."
      );

    }


    // ================================================
    // PASTIKAN ID SESUAI
    // ================================================

    if (
      String(voter.id) !==
      String(currentVoterId)
    ) {

      throw new Error(
        "Sesi pemilih tidak sesuai dengan data."
      );

    }


    // ================================================
    // CEK SUDAH MEMILIH
    // ================================================

    if (voter.has_voted) {

      alert(
        "⚠️ Pemilih ini sudah menggunakan hak suara."
      );

      window.location.href =
        "../";

      return;

    }


    // ================================================
    // SIMPAN SUARA
    // ================================================

    const {
      error: voteError
    } =
      await supabaseClient
        .from("votes")
        .insert({
          voter_id:
            currentVoterId,

          candidate_id:
            candidateId
        });


    if (voteError) {

      throw voteError;

    }


    // ================================================
    // TANDAI SUDAH MEMILIH
    // ================================================

    const {
      error: updateError
    } =
      await supabaseClient
        .from("voters")
        .update({
          has_voted: true
        })
        .eq(
          "id",
          currentVoterId
        );


    if (updateError) {

      console.error(
        "UPDATE VOTER ERROR:",
        updateError
      );

      /*
       * Suara sudah masuk tetapi status
       * pemilih gagal diperbarui.
       *
       * Jangan langsung memasukkan suara kedua.
       */

      throw new Error(
        "Suara sudah diproses, tetapi status pemilih gagal diperbarui. Hubungi admin."
      );

    }


    // ================================================
    // HAPUS SESSION
    // ================================================

    sessionStorage.removeItem(
      "voter_id"
    );

    sessionStorage.removeItem(
      "voter_name"
    );

    sessionStorage.removeItem(
      "voter_kelas"
    );


    // ================================================
    // BERHASIL
    // ================================================

    alert(
      "✅ SUARA BERHASIL DIREKAM!\n\n" +

      "Terima kasih telah menggunakan " +
      "hak suara dalam pemilihan OSIS."
    );


    window.location.href =
      "../";

  }

  catch (error) {

    console.error(
      "VOTING ERROR:",
      error
    );


    alert(
      "❌ Suara gagal disimpan.\n\n" +
      error.message
    );


    // ================================================
    // AKTIFKAN LAGI TOMBOL
    // ================================================

    buttons.forEach(button => {

      button.disabled =
        false;

    });

  }

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(text) {

  const div =
    document.createElement("div");


  div.textContent =
    text ?? "";


  return div.innerHTML;

}

</script>

</body>
</html>

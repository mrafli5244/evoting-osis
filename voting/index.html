<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pilih Kandidat — E-Voting OSIS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080b10;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px 15px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .voter {
      background: #11161d;
      border: 1px solid #29313c;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 25px;
      text-align: center;
    }

    .candidates {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(290px, 1fr)
      );
      gap: 20px;
    }

    .candidate {
      background: #11161d;
      border: 1px solid #29313c;
      border-radius: 18px;
      overflow: hidden;
      transition: .2s;
    }

    .candidate:hover {
      transform: translateY(-3px);
      border-color: #3b82f6;
    }

    .photo {
      width: 100%;
      height: 300px;
      background: #171d25;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .candidate-info {
      padding: 22px;
    }

    .number {
      color: #60a5fa;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .names {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.4;
      text-align: center;
    }

    .section {
      margin-top: 18px;
      text-align: left;
    }

    .section-title {
      font-weight: bold;
      color: #60a5fa;
      margin-bottom: 7px;
    }

    .vision,
    .mission {
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 14px;
    }

    .mission {
      white-space: pre-line;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .message {
      text-align: center;
      padding: 20px;
      color: #9ca3af;
    }

    .error {
      color: #fca5a5;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🗳️ Pilih Kandidat</h1>

  <div class="subtitle">
    Pemilihan Ketua & Wakil Ketua OSIS
  </div>

  <div class="voter">
    Pemilih:
    <strong id="voterName">-</strong>
  </div>

  <div id="message" class="message">
    Memuat kandidat...
  </div>

  <div id="candidates" class="candidates"></div>

</div>


<script>

// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
  "https://uctbslkumtrlwbonvutz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IcsnBvHUXh6q1I4nV4xTNA_vsYYxxbv";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// =====================================================
// AMBIL SESSION PEMILIH
// =====================================================

const voterId =
  sessionStorage.getItem("voter_id");

const voterName =
  sessionStorage.getItem("voter_name");


if (!voterId) {

  document.getElementById("message").innerHTML =
    "❌ Sesi pemilih tidak ditemukan.<br><br>" +
    "Silakan kembali ke halaman utama dan login lagi.";

} else {

  document
    .getElementById("voterName")
    .textContent =
      voterName || "-";

  loadCandidates();

}


// =====================================================
// LOAD KANDIDAT
// =====================================================

async function loadCandidates() {

  const message =
    document.getElementById("message");

  const box =
    document.getElementById("candidates");


  const {
    data,
    error
  } =
    await supabaseClient
      .from("candidates")
      .select(
        "id,number,chairman_name,vice_name,vision,mission,photo_url"
      )
      .eq("active", true)
      .order("number");


  if (error) {

    message.textContent =
      "Gagal memuat kandidat: " +
      error.message;

    message.classList.add("error");

    return;
  }


  if (!data || data.length === 0) {

    message.textContent =
      "Belum ada kandidat yang tersedia.";

    return;
  }


  message.textContent = "";

  box.innerHTML = "";


  data.forEach(candidate => {

    const card =
      document.createElement("div");

    card.className =
      "candidate";


    // =================================================
    // FOTO
    // =================================================

    let photoHTML = `
      <div class="photo">
        📷 Foto kandidat belum tersedia
      </div>
    `;


    if (candidate.photo_url) {

      photoHTML = `
        <div class="photo">
          <img
            src="${escapeHtml(candidate.photo_url)}"
            alt="Foto ${escapeHtml(candidate.chairman_name)} dan ${escapeHtml(candidate.vice_name)}"
          >
        </div>
      `;

    }


    // =================================================
    // VISI
    // =================================================

    const visionHTML =
      candidate.vision
      ?
      `
        <div class="section">

          <div class="section-title">
            🎯 VISI
          </div>

          <div class="vision">
            ${escapeHtml(candidate.vision)}
          </div>

        </div>
      `
      :
      "";


    // =================================================
    // MISI
    // =================================================

    const missionHTML =
      candidate.mission
      ?
      `
        <div class="section">

          <div class="section-title">
            📌 MISI
          </div>

          <div class="mission">
            ${escapeHtml(candidate.mission)}
          </div>

        </div>
      `
      :
      "";


    // =================================================
    // CARD
    // =================================================

    card.innerHTML = `

      ${photoHTML}

      <div class="candidate-info">

        <div class="number">
          NOMOR ${escapeHtml(candidate.number)}
        </div>

        <div class="names">

          ${escapeHtml(candidate.chairman_name)}

          <br>

          &

          <br>

          ${escapeHtml(candidate.vice_name)}

        </div>

        ${visionHTML}

        ${missionHTML}

        <button
          onclick="pilihKandidat('${candidate.id}')"
        >
          🗳️ PILIH KANDIDAT
        </button>

      </div>

    `;


    box.appendChild(card);

  });

}


// =====================================================
// PILIH KANDIDAT
// =====================================================

function pilihKandidat(candidateId) {

  const yakin =
    confirm(
      "Yakin memilih pasangan kandidat ini?"
    );


  if (!yakin) {
    return;
  }


  sessionStorage.setItem(
    "selected_candidate",
    candidateId
  );


  alert(
    "Kandidat dipilih. Tahap berikutnya adalah konfirmasi suara."
  );

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text ?? "";

  return div.innerHTML;

}

</script>

</body>
</html>

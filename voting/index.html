<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pilih Kandidat — E-Voting OSIS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080b10;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px 15px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .voter {
      background: #11161d;
      border: 1px solid #29313c;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 25px;
      text-align: center;
    }

    .candidates {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .candidate {
      background: #11161d;
      border: 1px solid #29313c;
      border-radius: 18px;
      overflow: hidden;
      text-align: center;
    }

    .photo {
      width: 100%;
      height: 280px;
      background: #171d25;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .candidate-info {
      padding: 20px;
    }

    .number {
      color: #60a5fa;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .names {
      font-size: 21px;
      font-weight: bold;
      line-height: 1.4;
    }

    .vision {
      color: #9ca3af;
      margin-top: 12px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .message {
      text-align: center;
      padding: 20px;
      color: #9ca3af;
    }

    .error {
      color: #fca5a5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🗳️ Pilih Kandidat</h1>

  <div class="subtitle">
    Pemilihan Ketua & Wakil Ketua OSIS
  </div>

  <div class="voter">
    Pemilih:
    <strong id="voterName">-</strong>
  </div>

  <div id="message" class="message">
    Memuat kandidat...
  </div>

  <div id="candidates" class="candidates"></div>

</div>


<script>

const SUPABASE_URL =
  "https://uctbslkumtrlwbonvutz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IcsnBvHUXh6q1I4nV4xTNA_vsYYxxbv";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// =====================================================
// AMBIL DATA PEMILIH DARI SESSION
// =====================================================

const voterId =
  sessionStorage.getItem("voter_id");

const voterName =
  sessionStorage.getItem("voter_name");


if (!voterId) {

  document.getElementById("message").innerHTML =
    "❌ Sesi pemilih tidak ditemukan.<br><br>" +
    "Silakan kembali ke halaman utama dan login lagi.";

} else {

  document.getElementById("voterName")
    .textContent = voterName || "-";

  loadCandidates();

}


// =====================================================
// LOAD KANDIDAT
// =====================================================

async function loadCandidates() {

  const message =
    document.getElementById("message");

  const box =
    document.getElementById("candidates");


  const {
    data,
    error
  } =
    await supabaseClient
      .from("candidates")
      .select(
        "id,number,chairman_name,vice_name,vision,photo_url"
      )
      .eq("active", true)
      .order("number");


  if (error) {

    message.textContent =
      "Gagal memuat kandidat: " +
      error.message;

    message.classList.add("error");

    return;
  }


  if (!data || data.length === 0) {

    message.textContent =
      "Belum ada kandidat yang tersedia.";

    return;
  }


  message.textContent = "";

  box.innerHTML = "";


  data.forEach(candidate => {

    const card =
      document.createElement("div");

    card.className =
      "candidate";


    let photoHTML = `
      <div class="photo">
        Foto kandidat belum tersedia
      </div>
    `;


    if (candidate.photo_url) {

      photoHTML = `
        <div class="photo">
          <img
            src="${escapeHtml(candidate.photo_url)}"
            alt="Foto kandidat"
          >
        </div>
      `;

    }


    card.innerHTML = `

      ${photoHTML}

      <div class="candidate-info">

        <div class="number">
          NOMOR ${candidate.number}
        </div>

        <div class="names">
          ${escapeHtml(candidate.chairman_name)}
          <br>
          &
          <br>
          ${escapeHtml(candidate.vice_name)}
        </div>

        ${
          candidate.vision
            ? `<div class="vision">
                ${escapeHtml(candidate.vision)}
              </div>`
            : ""
        }

        <button
          onclick="pilihKandidat('${candidate.id}')"
        >
          PILIH KANDIDAT
        </button>

      </div>

    `;


    box.appendChild(card);

  });

}


// =====================================================
// PILIH KANDIDAT
// =====================================================

function pilihKandidat(candidateId) {

  const yakin =
    confirm(
      "Yakin memilih pasangan kandidat ini?"
    );


  if (!yakin) {
    return;
  }


  sessionStorage.setItem(
    "selected_candidate",
    candidateId
  );


  alert(
    "Kandidat dipilih. Tahap berikutnya adalah konfirmasi suara."
  );

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}

</script>

</body>
</html>
